<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shrek Party - Estrazione personaggio</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #b9d98c, #6e9e3a);
      color: #2d2d2d;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      background: #fffaf0;
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    }

    h1 {
      margin-top: 0;
      color: #4b6b1f;
    }

    .subtitle {
      margin-bottom: 24px;
      color: #5c5c5c;
    }

    button {
      background: #7c4d1e;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 16px 28px;
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    button:hover {
      transform: scale(1.03);
    }

    #spinner {
      font-size: 24px;
      font-weight: bold;
      min-height: 40px;
      margin: 25px 0 10px;
      color: #6b3f16;
    }

    #resultCard {
      display: none;
      margin-top: 25px;
      padding: 20px;
      border-radius: 18px;
      background: #fff;
      border: 2px solid #d8c9a3;
    }

    #characterImage {
      width: 100%;
      max-width: 320px;
      border-radius: 18px;
      margin: 15px auto;
      display: block;
      box-shadow: 0 6px 18px rgba(0,0,0,0.2);
    }

    #characterName {
      font-size: 30px;
      color: #4b6b1f;
      margin: 10px 0;
    }

    .info-block {
      text-align: left;
      max-width: 520px;
      margin: 0 auto;
      line-height: 1.5;
    }

    .label {
      font-weight: bold;
      color: #6b3f16;
    }

    .error {
      color: darkred;
      font-weight: bold;
      margin-top: 20px;
    }

    .small-note {
      margin-top: 20px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏰 Festa a tema Shrek</h1>
    <p class="subtitle">Il tuo destino nel regno di Molto Molto Lontano ti aspetta...</p>

    <button id="drawBtn" onclick="estrai()">Estrai il tuo personaggio</button>

    <div id="spinner"></div>

    <div id="resultCard">
      <h2>🎉 Il tuo personaggio è...</h2>
      <div id="characterName"></div>
      <img id="characterImage" src="" alt="Immagine personaggio" />
      <div class="info-block">
        <p><span class="label">Dress code:</span> <span id="dressCode"></span></p>
        <p><span class="label">Idea look:</span> <span id="lookIdea"></span></p>
      </div>
    </div>

    <div id="errorMessage" class="error"></div>

    <p class="small-note">Apri il link che ti è stato inviato e scopri chi sarai alla festa ✨</p>
  </div>

  <script>
    const assignments = {
      "gs92": {
        name: "Draghessa",
        image: "images/draghessa.jpg",
        dressCode: "Look grintoso e scenografico: abito o outfit nero, rosso o viola, dettagli da drago, ali facoltative, make-up intenso.",
        lookIdea: "Puoi puntare su corna/cerchietto, eyeliner marcato, accessori metallici e un tocco 'regale ma selvaggio'."
      },
      "lu47": {
        name: "Ciuchino",
        image: "images/ciuchino.jpg",
        dressCode: "Outfit comodo sui toni del grigio, beige o marrone chiaro. Perfetti orecchie da asino, coda e aria super simpatica.",
        lookIdea: "Il pezzo forte è l'energia: sorriso, espressioni buffe e tanta voglia di chiacchierare."
      },
      "as31": {
        name: "Figlio di Draghessa e Ciuchino",
        image: "images/figlio_draghessa_ciuchino.jpg",
        dressCode: "Look tenero e fantasioso: base chiara o pastello con dettagli da draghetto, piccole ali, orecchie da ciuchino e tocco giocoso.",
        lookIdea: "Puoi scegliere uno stile 'baby drago' divertente: ali leggere, coda, accessori colorati e un make-up molto soft."
      }
    };

    const animationNames = [
      "Shrek",
      "Fiona",
      "Ciuchino",
      "Draghessa",
      "Gatto con gli Stivali",
      "Pinocchio",
      "Fata Madrina",
      "Principe Azzurro",
      "Figlio di Draghessa e Ciuchino"
    ];

    function getInviteId() {
      const params = new URLSearchParams(window.location.search);
      return params.get("id");
    }

    function estrai() {
      const inviteId = getInviteId();
      const spinner = document.getElementById("spinner");
      const resultCard = document.getElementById("resultCard");
      const errorMessage = document.getElementById("errorMessage");
      const drawBtn = document.getElementById("drawBtn");

      errorMessage.textContent = "";
      resultCard.style.display = "none";

      if (!inviteId || !assignments[inviteId]) {
        spinner.textContent = "";
        errorMessage.textContent = "Link non valido o personaggio non trovato.";
        return;
      }

      drawBtn.disabled = true;

      let count = 0;
      const maxCount = 22;

      const interval = setInterval(() => {
        const randomName = animationNames[Math.floor(Math.random() * animationNames.length)];
        spinner.textContent = randomName;
        count++;

        if (count >= maxCount) {
          clearInterval(interval);

          const character = assignments[inviteId];

          spinner.textContent = "✨ Destino compiuto! ✨";
          document.getElementById("characterName").textContent = character.name;
          document.getElementById("characterImage").src = character.image;
          document.getElementById("characterImage").alt = character.name;
          document.getElementById("dressCode").textContent = character.dressCode;
          document.getElementById("lookIdea").textContent = character.lookIdea;

          resultCard.style.display = "block";
        }
      }, 120);
    }
  </script>
</body>
</html>
